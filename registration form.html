<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library Registration Form</title>
    <link rel="stylesheet" href="style.css"> <!-- Optional CSS for styling -->
</head>
<body>
    <div class="container">
        <form action="submit_form.php" method="post"> <!-- Action points to server-side script -->
            <h2>Register</h2>
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" required placeholder="Your first name">
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" required placeholder="Your last name">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Your email address">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="Your password">
            <input type="submit" value="Register">
        </form>
    </div>
</body>
</html>
